<style>
:root{--bg:#0E0B1A;--bg2:#151126;--card:#1B1630;--card2:#241D40;--line:#2E2650;--fg:#F6F3FF;--muted:#A79FC4;--faint:#6E6690;--cy:#00E5FF;--ir:#7B4DFF;--mg:#FF2E88;--sf:#FFB829;--ok:#2BD67B;--bad:#FF5A6E;--grad:linear-gradient(110deg,var(--cy),var(--ir) 55%,var(--mg));--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F5F3FB;--bg2:#ECE8F7;--card:#FFFFFF;--card2:#F2EEFC;--line:#E1DBF2;--fg:#17122B;--muted:#5F5880;--faint:#8F88AB;--cy:#008BA3;--ir:#5B2FE0;--mg:#D9126E;--sf:#B87800;--ok:#11834A;--bad:#D3263F;color-scheme:light}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 30% at 85% 0%,color-mix(in srgb,var(--ir) 24%,transparent),transparent 70%),radial-gradient(35% 28% at 0% 40%,color-mix(in srgb,var(--cy) 12%,transparent),transparent 70%)}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--display);letter-spacing:-.025em;margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--display);letter-spacing:-.03em}
.brand img{width:36px;height:36px}
.brand small{display:block;font:600 11.5px var(--body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:22px 16px 60px;display:grid;gap:16px}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 8%),var(--card) 40%);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0;box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent),0 24px 48px -28px rgba(10,5,30,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:10px 14px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:700;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--ir)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--ir) 55%,#000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ir) 55%,#000)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn:focus-visible,input:focus-visible{outline:2.5px solid var(--cy);outline-offset:2px}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg2);border-radius:13px;padding:13px;outline:none;font-size:16px}
.input:focus{border-color:var(--ir)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font:800 34px var(--display);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--faint);margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--ir) 40%,var(--card)),var(--card) 70%)}
.kpi.hl .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:44px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h2{font-size:18px}
.hb{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hb .t{height:12px;border-radius:12px;background:var(--card2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.hb .t i{display:block;height:100%;border-radius:12px;background:var(--grad)}
.hb .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:inline-grid;place-items:center;font:800 14px var(--display);margin-right:10px;vertical-align:middle}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.pill.on{color:var(--ok)}.pill.off{color:var(--faint)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--sf) 40%,var(--line));background:color-mix(in srgb,var(--sf) 9%,var(--card));font-size:14px}
.note b{display:block}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.gate{max-width:400px;margin:8vh auto 0;display:grid;gap:14px;text-align:center}
.gate .card{text-align:left;display:grid;gap:12px}
.gate img{width:84px;margin:0 auto;filter:drop-shadow(0 14px 28px color-mix(in srgb,var(--ir) 50%,transparent))}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1em}
.tablewrap{overflow-x:auto;margin:0 -8px;padding:0 8px}
.cards{display:none}
footer{text-align:center;color:var(--muted);font-size:13px}
footer img{height:16px;vertical-align:middle;margin-left:4px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}}
@media (max-width:700px){
  .kpis{grid-template-columns:1fr 1fr}.kpi.hl{grid-column:1/-1}.grid{grid-template-columns:1fr}
  .tablewrap{display:none}.cards{display:grid;gap:10px}
  .acc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
  .acc .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc .sub{font-size:12.5px;color:var(--muted)}
  .acc .v{text-align:right;font-weight:800;font-family:var(--display)}
  .top .hide-m{display:none}
  .grid>.card{grid-column:auto!important}
  .kpi:last-child{grid-column:1/-1}
  .kpi .v{font-size:30px}
  .brand{font-size:17px;white-space:nowrap}.brand small{font-size:10px}
  .top .btn{padding:9px 11px;font-size:13.5px}
  .top .btn .t{display:none}
}
</style>
</head>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fN=new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}),fI=new Intl.NumberFormat('es-VE');
const usd=v=>'$'+fN.format(Math.round((+v||0)*100)/100);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-VE',{day:'numeric',month:'short',year:'numeric'}):'—';
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const daysAgo=d=>d?Math.round((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/864e5):999;
async function hash(salt,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const CAT={vivienda:['🏠','Vivienda'],comida:['🛒','Comida'],transporte:['🚌','Transporte'],servicios:['💡','Servicios'],salud:['💊','Salud'],educacion:['🎒','Colegio'],cuotas:['🧾','Cuotas'],gustos:['🍕','Gustos'],imprevistos:['🛟','Imprevistos'],ahorro:['🐷','Ahorro']};
const ADM='mq_admin';let IN=sessionStorage.getItem('mq_admin_in')==='1';

/* ---------- lectura de datos (modo local: mismo navegador) ---------- */
function loadAll(){const accs=LS.get('mq_cuentas',{});const rate=LS.get('mq_tasa',{bcv:877.9}).bcv||877.9;
  return Object.entries(accs).map(([id,a])=>{const d=LS.get('mq_datos_'+id,{})||{};const toU=(m,c)=>c==='bs'?(+m||0)/rate:(+m||0);
    const ing=(d.ingresos||[]).reduce((x,i)=>x+toU(i.m,i.cur),0),gas=(d.gastos||[]).reduce((x,g)=>x+toU(g.m,g.cur),0);
    const porCat={};(d.gastos||[]).forEach(g=>{porCat[g.c]=(porCat[g.c]||0)+toU(g.m,g.cur)});
